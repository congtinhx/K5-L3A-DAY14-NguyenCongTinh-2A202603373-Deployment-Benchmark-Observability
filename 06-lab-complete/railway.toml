# ============================================================
# Railway — build bằng Dockerfile, healthcheck /health.
# PORT do Railway cấp, Dockerfile CMD đọc ${PORT:-8000}.
# Biến cần đặt trên Railway (Variables), không ghi ở đây:
#   AGENT_API_KEY, REDIS_URL (= ${{Redis.REDIS_URL}}), ENVIRONMENT=production
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
