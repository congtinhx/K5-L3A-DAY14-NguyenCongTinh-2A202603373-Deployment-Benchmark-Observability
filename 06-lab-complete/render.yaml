# ============================================================
# Render Blueprint — agent (Docker) + Redis-compatible Key Value.
# AGENT_API_KEY dùng `sync: false`: Render hỏi giá trị lúc tạo Blueprint,
# không ghi secret trong file. REDIS_URL lấy từ service Key Value.
# ============================================================
services:
  - type: web
    name: production-ai-agent
    runtime: docker
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"

  - type: keyvalue
    name: agent-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []
